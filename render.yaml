services:
  - type: web
    name: agrivision-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python scripts/generate_synthetic_samples.py && python scripts/train_weather_model.py
    startCommand: uvicorn agrivision.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
